[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=AI_Page
    --cov-report=term-missing
    --cov-fail-under=0
    -m "not e2e"
markers =
    e2e: end-to-end tests that require a running dev server (deselect with -m "not e2e")
    slow: marks tests as slow
filterwarnings =
    ignore::DeprecationWarning
